# Pinned dated nightly, adopted under the soak window (SOAK_DAYS in
# scripts/soak/constants.mts): the pin is the newest nightly at least that
# old on the adoption date, and bumps follow the same rule. The `adopted:`
# line below is machine-read by `pnpm run soak` to enforce it.
#
# One exact toolchain covers every workspace in the repo (nub, nub-native,
# nub-phantom, vendor/aube). rust-version stays the stable msrv floor
# (1.95, for core::hint::cold_path() on rare arms of hot install loops in
# the vendored aube engine).
#
# adopted: 2026-07-11
[toolchain]
channel = "nightly-2026-07-04"
components = ["rustfmt", "clippy"]
